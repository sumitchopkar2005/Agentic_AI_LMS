[project]
name = "agentic-lms-llm"
version = "0.1.0"
description = "Model-agnostic LLM abstraction layer for Agentic LMS"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
